[project]
name = "atif"
version = "2.0.0.dev0"
description = "Python SDK for the Agent Trajectory Interchange Format (ATIF)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
keywords = [
    "atif",
    "agent",
    "trajectory",
    "llm",
    "evaluation",
    "benchmarking",
    "observability",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.14.0",
]

[project.urls]
Homepage = "https://github.com/harbor-framework/atif"
Repository = "https://github.com/harbor-framework/atif"
Issues = "https://github.com/harbor-framework/atif/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
    "ty",
]

[build-system]
requires = ["uv_build>=0.9.0,<1.0.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ty.environment]
python-version = "3.12"
